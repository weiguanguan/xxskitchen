<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <script>
      if (window.location.pathname === '/') window.location.replace('/home');
    </script>
    <title>添加菜品 · Kitchen Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <a class="home-button" href="/home" aria-label="返回主页" title="返回主页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1v-9.2Z"/></svg>
      </a>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">添加一道菜品</h1>
      </section>

      <form id="dish-form" novalidate>
        <section class="form-section photo-section">
          <div class="section-heading">
            <div><h2>成品照片</h2></div>
          </div>
          <div class="photo-card" id="photo-card">
            <div class="photo-placeholder" id="photo-placeholder">
              <div class="camera-icon" aria-hidden="true"><span></span></div>
              <strong>记录这道菜的样子</strong>
              <span>支持拍照或从相册选择</span>
              <div class="photo-actions">
                <button class="secondary-button" type="button" id="camera-button">拍照</button>
                <button class="primary-button small" type="button" id="album-button">选择照片</button>
              </div>
            </div>
            <img id="photo-preview" alt="菜品照片预览" />
            <button class="remove-photo" type="button" id="remove-photo" aria-label="移除照片">×</button>
          </div>
          <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
          <input id="album-input" type="file" accept="image/*" hidden />
          <p class="field-error" id="photo-error" role="alert"></p>
        </section>

        <section class="form-section">
          <div class="section-heading">
            <div><h2>菜品名称</h2></div>
          </div>
          <label class="sr-only" for="dish-name">菜品名称</label>
          <input class="text-input" id="dish-name" name="dish-name" type="text" maxlength="40" placeholder="例如：番茄牛腩" autocomplete="off" />
          <p class="field-error" id="name-error" role="alert"></p>
        </section>

        <section class="form-section">
          <div class="section-heading">
            <div><h2>菜品标签</h2></div>
            <span class="optional-label">可多选</span>
          </div>
          <div class="tag-list" id="tag-list" aria-label="菜品标签">
            <button type="button" class="tag" data-tag="家常菜">家常菜</button>
            <button type="button" class="tag" data-tag="下饭菜">下饭菜</button>
            <button type="button" class="tag" data-tag="快手菜">快手菜</button>
            <button type="button" class="tag" data-tag="一人食">一人食</button>
            <button type="button" class="tag" data-tag="高蛋白">高蛋白</button>
            <button type="button" class="tag" data-tag="周末慢炖">周末慢炖</button>
            <button type="button" class="tag add-tag" id="add-tag">＋ 自定义</button>
          </div>
          <div class="custom-tag-row" id="custom-tag-row" hidden>
            <label class="sr-only" for="custom-tag">输入自定义标签</label>
            <input class="text-input compact" id="custom-tag" type="text" maxlength="12" placeholder="输入标签名称" />
            <button class="primary-button small" type="button" id="confirm-tag">添加</button>
          </div>
          <p class="selected-hint" id="selected-hint">还没有选择标签</p>
        </section>

        <section class="form-section ingredients-section">
          <div class="section-heading">
            <div><h2>食材</h2></div>
            <span class="optional-label">可添加多项</span>
          </div>
          <div class="custom-tag-row ingredient-input-row">
            <label class="sr-only" for="ingredient-input">输入食材名称</label>
            <input class="text-input compact" id="ingredient-input" type="text" maxlength="20" placeholder="输入食材名称" />
            <button class="primary-button small" type="button" id="add-ingredient">添加</button>
          </div>
          <div class="tag-list ingredient-list" id="ingredient-list" aria-label="已添加食材"></div>
          <p class="selected-hint" id="ingredient-hint">还没有添加食材</p>
        </section>

        <section class="form-section notes-section">
          <div class="section-heading">
            <div><h2>备注</h2></div>
            <span class="optional-label">选填</span>
          </div>
          <label class="sr-only" for="notes">备注</label>
          <textarea class="text-input textarea" id="notes" name="notes" maxlength="300" placeholder="记下口感、灵感，或下次想调整的地方……"></textarea>
          <div class="character-count"><span id="character-count">0</span> / 300</div>
        </section>

        <div class="form-footer">
          <button class="primary-button save-button" type="submit"><span>保存菜品</span><span class="arrow">↗</span></button>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </form>
    </main>
    <script src="runtime-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
