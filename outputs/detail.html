<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5e6" />
    <title>菜品详情 · Kitchen Workspace</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="detail.css" />
  </head>
  <body>
    <main class="detail-shell">
      <header class="detail-topbar"><a class="home-button detail-back" href="/home" aria-label="返回主页" title="返回主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1v-9.2Z"/></svg></a><span>菜品详情</span><span class="detail-topbar-spacer" aria-hidden="true"></span></header>
      <section class="detail-content" id="detail-content" hidden>
        <img class="detail-photo" id="detail-photo" alt="" />
        <h1 id="detail-name"></h1>
        <div class="detail-tags" id="detail-tags"></div>
        <section class="detail-section" id="ingredients-section"><h2>食材</h2><div class="ingredient-pills" id="detail-ingredients"></div></section>
        <section class="detail-section" id="notes-section"><h2>备注</h2><p id="detail-notes"></p></section>
        <div class="detail-actions"><a class="detail-edit" id="edit-dish" href="/add.html">编辑菜品</a><button class="detail-delete" id="delete-dish" type="button">删除菜品</button></div>
        <p class="detail-feedback" id="detail-feedback" role="status"></p>
      </section>
      <section class="detail-state" id="detail-state">正在读取菜品信息…</section>
    </main>
    <script src="runtime-config.js"></script>
    <script type="module" src="detail.js"></script>
  </body>
</html>
